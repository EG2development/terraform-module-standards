# Checks for this repository: the shared workflows, the scripts, the rulesets
# and the documentation. Nothing here touches a cloud account.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rulesets are valid JSON with the fields GitHub requires
        run: |
          for f in rulesets/*.json; do
            jq -e '.name and .target and .enforcement and (.rules | type == "array")' "$f" > /dev/null
            echo "ok $f"
          done

      - name: Shared workflows ask for no more than their callers grant
        # A called workflow cannot raise the caller's GITHUB_TOKEN permissions;
        # a job that asks for more fails every run at startup. The grants are
        # those of the callers in terraform-aws-module-template.
        run: |
          check() {
            BAD="$(yq -o=json '.jobs' "$1" | jq -r --argjson grant "$2" '
              def rank: {"none": 0, "read": 1, "write": 2}[.];
              to_entries[] | .key as $job | (.value.permissions // {})
              | if type == "object" then to_entries[] else {key: "all", value: sub("-all$"; "")} end
              | select((($grant[.key] // "none") | rank) < (.value | rank))
              | "\($job) asks for \(.key): \(.value)"')"
            if [ -n "$BAD" ]; then
              while read -r line; do echo "::error file=$1::$line, more than the callers grant"; done <<< "$BAD"
              return 1
            fi
            echo "ok $1"
          }
          check .github/workflows/terraform-ci.yml '{"contents": "read", "pull-requests": "read"}'
          check .github/workflows/terraform-release.yml '{"contents": "read"}'

      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/*.sh
          bash -n scripts/*.sh

      - name: Workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL "${BASE}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  ci-ok:
    # Named to match the status check the shared ruleset requires. In module
    # repositories the same name comes from calling the reusable workflow from a
    # job called "ci".
    name: ci / CI passed
    if: always()
    needs: [pr-title, check]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            [ to_entries[]
              | select(.value.result != "success")
              | select((.key == "pr-title" and .value.result == "skipped") | not)
            ] | length == 0' > /dev/null
