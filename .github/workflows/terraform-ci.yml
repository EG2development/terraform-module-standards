# Reusable pull-request CI for Terraform module repositories.
#
# Called from each module repository's .github/workflows/ci.yml:
#
#   jobs:
#     ci:
#       uses: OWNER/terraform-module-standards/.github/workflows/terraform-ci.yml@main
#       with:
#         terraform-min-version: "1.9.8"
#         aws-provider-min-version: "6.0.0"
#
# The only status check a ruleset needs to require is "ci / CI passed": the
# final job fails unless every other job passed. Job names in this file are
# part of that contract, so change them in the ruleset too, or not at all.
#
# Nothing here needs cloud credentials. Tests run against a mocked provider.

name: Terraform module CI

on:
  workflow_call:
    inputs:
      terraform-min-version:
        description: >-
          The newest patch release of the oldest Terraform minor version that
          versions.tf allows. Raise it when required_version is raised.
        type: string
        required: false
        default: "1.9.8"
      aws-provider-min-version:
        description: >-
          The exact hashicorp/aws version matching the minimum in versions.tf
          (for example "6.0.0" for ">= 6.0"). When set, a job runs the tests
          with the provider pinned to it. Empty skips the job.
        type: string
        required: false
        default: ""
      checkov-skip-checks:
        description: >-
          Comma-separated Checkov check IDs to skip. Every ID must be justified
          in the module's README under "Security scanning".
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  # main accepts pull requests from dev (the promotion) and from release-please
  # only. Every other pull request into main fails this job, and with it
  # "ci / CI passed", which the main ruleset requires.
  source:
    name: Source branch
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: main accepts dev and release-please only
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in
            dev|release-please--branches--main) echo "ok: pull request into main from $HEAD" ;;
            *) echo "::error title=wrong source branch::Pull requests into main come from dev (scripts/promote.sh) or from release-please, never from $HEAD. Retarget it: gh pr edit --base dev"; exit 1 ;;
          esac

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # The pull-request title becomes the squash commit subject, which is what
      # release-please reads. Anything else in the title breaks releases.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            revert
          requireScope: false
          validateSingleCommit: false

  test:
    name: Test (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        terraform: ${{ fromJSON(format('["{0}", "latest"]', inputs.terraform-min-version)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate module
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate examples
        run: |
          for dir in examples/*/; do
            echo "::group::${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - name: Test
        run: terraform test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: TFLint
        env:
          # Plugin downloads are rate-limited without a token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release binary rather than terraform-docs/gh-actions: its latest
      # release (v1.4.1) bundles terraform-docs 0.20.0, whose tables differ from
      # the 0.24.0 that contributors run. Bump both values together; Dependabot
      # cannot see them.
      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: 0.24.0
          TERRAFORM_DOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
        run: |
          archive="${RUNNER_TEMP}/terraform-docs.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          echo "${TERRAFORM_DOCS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" terraform-docs
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # Fails when the generated Inputs/Outputs tables in README.md are stale.
      # Regenerate locally with: terraform-docs .
      - name: README tables are current
        run: terraform-docs --output-check .

      # Every page under docs/, the README and the rest. The module's
      # .markdownlint-cli2.jsonc (from the template) sets the rules.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  provider-floor:
    name: Provider floor
    if: inputs.aws-provider-min-version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      # An override file narrows the module's ">= X" to exactly X, so the tests
      # prove the module works with the oldest provider it claims to support.
      - name: Test with the minimum AWS provider
        env:
          AWS_MIN: ${{ inputs.aws-provider-min-version }}
        run: |
          cat > zz_provider_floor_override.tf <<EOF
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "= ${AWS_MIN}"
              }
            }
          }
          EOF
          terraform init -backend=false -input=false
          terraform test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Consumers calling this module from a Git source do not scan its code,
      # so the module repository is where its resources are scanned.
      - uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          skip_check: ${{ inputs.checkov-skip-checks }}

  ci-ok:
    name: CI passed
    if: always()
    needs: [source, pr-title, test, lint, docs, security, provider-floor]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # pr-title is skipped on push and scheduled runs, source unless the
          # pull request targets main, provider-floor when no floor is
          # configured; nothing else may be.
          echo "$RESULTS" | jq -e '
            [ to_entries[]
              | select(.value.result != "success")
              | select(((.key == "pr-title" or .key == "provider-floor" or .key == "source") and .value.result == "skipped") | not)
            ] | length == 0' > /dev/null
