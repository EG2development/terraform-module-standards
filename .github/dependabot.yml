# Keeps the pinned actions in this repository's workflow current. Each PR title is a
# Conventional Commit ("ci: bump ..."), so it passes the PR title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    # A release is a week old before it is proposed: time for a compromised
    # or broken release to be noticed and pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
